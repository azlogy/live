<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日連線商品</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  .hl { position: absolute; border: 3px solid #FF2D78; border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 9999px rgba(0,0,0,.18); pointer-events: none; box-sizing: border-box; }
  .cw { position: relative; overflow: hidden; width: 76px; height: 76px; border-radius: 8px; flex-shrink: 0; background: #e9e8e2; }
  .cw img { width: 100%; height: 100%; object-fit: cover; display: block; }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 15px; }
  header { background: #06C755; color: #fff; padding: 12px 14px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header .who { margin-left: auto; font-size: 13px; font-weight: 400; opacity: .95; }
  main { padding: 12px; padding-bottom: 90px; }
  .box { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .banner { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .ok { background: #EAF3DE; color: #27500A; } .ng { background: #FCEBEB; color: #791F1F; } .info { background: #E6F1FB; color: #0C447C; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid transparent; }
  .card.sel { border-color: #06C755; }
  .ph { position: relative; aspect-ratio: 1 / 1; background: #e9e8e2; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .ph::after { content: '🔍'; position: absolute; right: 6px; top: 6px; font-size: 13px; background: rgba(255,255,255,.85); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .tag { position: absolute; top: 6px; left: 6px; font-size: 12px; padding: 2px 8px; border-radius: 8px; }
  .no { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 6px; }
  .cb { padding: 8px; }
  .price { font-size: 15px; color: #C2410C; margin-top: 2px; }
  .price b { font-weight: 700; }
  .memo { font-size: 12px; color: #888; }
  .pg { display: inline-grid; grid-template-columns: repeat(3, 5px); gap: 1.5px; vertical-align: middle; margin-right: 5px; flex: none; padding: 2px; background: #fff; border-radius: 3px; border: 1px solid #9FD9C4; }
  .pg i { width: 5px; height: 5px; background: #D5EFE5; border-radius: 1px; }
  .pg i.on { background: #E0457B; }
  .pos { font-size: 12px; color: #0F6E56; background: #E1F5EE; display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; margin-bottom: 3px; }
  .pname { font-size: 13px; line-height: 1.35; color: #333; min-height: 35px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .step { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .step button { width: 38px; height: 34px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 18px; }
  .step b { font-size: 18px; }
  .memobtn { background: none; border: 0; color: #888; font-size: 13px; padding: 6px 2px 0; cursor: pointer; }
  input[type=text] { width: 100%; height: 36px; border: 1px solid #ccc; border-radius: 8px; padding: 0 10px; font-size: 14px; margin-top: 6px; }
  .btn { width: 100%; height: 50px; border: 0; border-radius: 12px; background: #06C755; color: #fff; font-size: 17px; font-weight: 700;
         box-shadow: 0 4px 0 #04913E; transition: transform .06s, box-shadow .06s, background .15s; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #04913E; background: #05B04B; }
  .btn:disabled { background: #b8b8b2; box-shadow: none; transform: none; }
  .btn.sending { background: #05A045; box-shadow: none; transform: translateY(3px); }
  .step button:active, .ops button:active, .addsub:active { transform: scale(.94); background: #E1F5EE; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 10px 12px; box-shadow: 0 -1px 0 #e5e3db; z-index: 5; justify-content: center; }
  h3 { margin: 4px 0 10px; font-size: 16px; }
  .line { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #eee; }
  .line:first-of-type { border-top: 0; }
  .line img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #e9e8e2; flex-shrink: 0; }
  .line .t { flex: 1; min-width: 0; }
  .ops { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .ops button { height: 32px; min-width: 36px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px; padding: 0 10px; }
  .pill { font-size: 12px; padding: 1px 7px; border-radius: 6px; }
  .muted { color: #888; font-size: 13px; }
  .center { text-align: center; padding: 40px 16px; color: #666; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 78px; z-index: 9; display: none; white-space: pre-line; }
  .subl { border-top: 1px dashed #ddd; padding-top: 6px; margin-top: 6px; }
  .subsel { width: 100%; height: 40px; border: 2px solid #06C755; border-radius: 8px; background: #F2FBF5; font-size: 15px; font-weight: 600; padding: 0 10px; color: #222; -webkit-appearance: menulist; }
  .subsel.err { border-color: #E24B4A; background: #FFF6F6; }
  .subl input.sub { margin-top: 6px; text-transform: uppercase; }
  .subl input.sub.err { border-color: #E24B4A; background: #FFF6F6; }
  .addsub { margin-top: 6px; width: 100%; height: 32px; border: 1px dashed #06C755; border-radius: 8px; background: #fff; color: #0F6E56; font-size: 13px; }
  .pill.sb { background: #E1F5EE; color: #085041; }
  /* 處理中遮罩 */
  #busy { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 15px; color: #333; }
  #busy .bx { background: #fff; border-radius: 16px; padding: 24px 32px; box-shadow: 0 8px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 17px; font-weight: 700; color: #1a1a1a; }
  .spin { width: 42px; height: 42px; border: 5px solid #d8f3e3; border-top-color: #06C755; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* 下單成功視窗 */
  #done { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; align-items: center; justify-content: center; padding: 20px; }
  #done .dlg { background: #fff; border-radius: 16px; width: 100%; max-width: 380px; padding: 22px 18px 16px; text-align: center; }
  #done .ok-ic { width: 64px; height: 64px; border-radius: 50%; background: #06C755; color: #fff; font-size: 38px; line-height: 64px; margin: 0 auto 10px; }
  #done h2 { margin: 0 0 4px; font-size: 20px; }
  #done .list { text-align: left; margin: 14px 0; max-height: 40vh; overflow-y: auto; }
  #done .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #eee; }
  #done .row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #e9e8e2; }
  #done .row b { font-size: 17px; margin-left: auto; }
  .flash { animation: fl 2.4s ease-out; }
  @keyframes fl { 0%, 40% { background: #EAF3DE; } 100% { background: transparent; } }

  /* ===== 電腦版（螢幕寬度 760px 以上）：商品多欄，「我的訂單」放右邊側欄 ===== */
  @media (min-width: 760px) {
    header { padding: 14px max(24px, calc((100% - 1200px) / 2 + 24px)); }
    main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 100px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .side { position: sticky; top: 72px; max-height: calc(100vh - 160px); overflow-y: auto; }
    .side .box { margin-top: 0 !important; }
    .bar { display: flex; justify-content: center; }
    .bar .btn { max-width: 480px; }
    #toast { left: 50%; right: auto; width: 460px; transform: translateX(-50%); }
    .box.bind { max-width: 480px; margin: 40px auto; }
  }
</style>
</head>
<body>
<header><span>今日連線商品</span><span class="who" id="who"></span></header>
<main id="app"><div class="center">載入中…</div></main>
<div class="bar" id="bar" style="display:none"><button class="btn" id="submit">送出訂單</button></div>
<div id="toast" class="banner"></div>
<div id="busy"><div class="bx"><div class="spin"></div><div id="busyText">處理中…</div></div></div>
<div id="done"><div class="dlg"><div class="ok-ic">✓</div><h2 id="doneTitle">下單成功</h2><div class="muted" id="doneSub"></div>
  <div class="list" id="doneList"></div><button class="btn" id="doneOk">好</button></div></div>

<script>
// ===== 設定：只要改這兩行 =====
const LIFF_ID = '2009296855-h6x6FV1n';
const API_URL = 'https://script.google.com/macros/s/AKfycbwjQK4vcmgDAeD-uJ424b-IM3ciq6mvAp1uILcIy27sGWsiBsx8_i7Rz6pAY9oO6DYeKg/exec';
// ===============================
let S = null;          // 伺服器回傳的狀態
let cart = {};         // { 商品番号: [ { sub: 子會員, q: 數量, memo: 備註 } ] }（一般會員每個商品只有一行，sub 是空的）
let idToken = '';
let busy = false;
let AG = false;        // 是不是代理帳號

// 呼叫後端（GAS 的 doPost）
function api(req) {
  req.idToken = idToken;
  // 不加 Content-Type（預設 text/plain），瀏覽器就不會先送 CORS 預檢，GAS 才收得到
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(req) }).then(r => r.json());
}

function toast(text, good) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'banner ' + (good ? 'ok' : 'ng'); t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3500);
}

// 價格顯示：2138 → ¥2,138
function yen(v) { const n = Number(String(v || '').replace(/[^\d.]/g, '')); return n > 0 ? '¥' + Math.floor(n).toLocaleString('ja-JP') : ''; }
function num(v) { return Number(String(v || '').replace(/[^\d.]/g, '')) || 0; }

// 一覧は小さい画像（100 枚でも軽い）；拡大時は大きい画像
function sm(u) { return String(u || '').replace(/([?&]sz=)w\d+/, '$1w400'); }
// 位置：「上段左」這種貨架用語客人看不懂 → 改成「左上」＋ 3×3 小格子標出在照片哪裡
function posInfo(p) {
  p = String(p || '');
  const r = /上/.test(p) ? 0 : /下/.test(p) ? 2 : 1;
  const c = /左/.test(p) ? 0 : /右/.test(p) ? 2 : 1;
  const V = ['上', '', '下'], H = ['左', '', '右'];
  let t = (H[c] + V[r]) || '中間';
  if (!H[c] && V[r]) t = V[r] + '面中間';
  if (H[c] && !V[r]) t = H[c] + '邊';
  let g = '';
  for (let i = 0; i < 9; i++) g += `<i class="${i === r * 3 + c ? 'on' : ''}"></i>`;
  return { text: t, grid: `<span class="pg">${g}</span>` };
}
// 一張照片拆成好幾個商品時：卡片只放大顯示那個商品，並用粉紅框圈起來（AI 給的框）
// 算好的大小記在 NAT，下次重畫（按＋−）直接套用，照片不會閃一下、抖一下
const NAT = {};
function cropCalc(nw, nh, boxStr) {
  const b = String(boxStr || '').split(',').map(Number);
  if (b.length !== 4 || !nw) return null;
  const x0 = b[1] / 1000 * nw, y0 = b[0] / 1000 * nh, x1 = b[3] / 1000 * nw, y1 = b[2] / 1000 * nh;
  const bw = x1 - x0, bh = y1 - y0;
  let side = Math.max(Math.max(bw, bh) * 1.3, Math.min(nw, nh) * 0.35);
  // 不要超出照片（兩旁出現灰邊）；除非商品本身比照片的短邊還大
  if (side > Math.min(nw, nh)) side = Math.max(Math.min(nw, nh), Math.max(bw, bh));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const sx = side <= nw ? Math.min(Math.max(0, cx - side / 2), nw - side) : (nw - side) / 2;
  const sy = side <= nh ? Math.min(Math.max(0, cy - side / 2), nh - side) : (nh - side) / 2;
  const P = v => (v / side * 100).toFixed(3) + '%';
  return {
    img: `position:absolute;max-width:none;object-fit:fill;border-radius:0;width:${P(nw)};height:${P(nh)};left:${P(-sx)};top:${P(-sy)}`,
    hl: `left:${P(x0 - sx)};top:${P(y0 - sy)};width:${P(bw)};height:${P(bh)}`
  };
}
function fitCrop(img) {
  if (!img.naturalWidth) return;
  NAT[img.getAttribute('src')] = [img.naturalWidth, img.naturalHeight];
  const c = cropCalc(img.naturalWidth, img.naturalHeight, img.dataset.box);
  if (!c) return;
  img.style.cssText = c.img;
  let hl = img.parentNode.querySelector('.hl');
  if (!hl) { hl = document.createElement('i'); hl.className = 'hl'; img.parentNode.appendChild(hl); }
  hl.style.cssText = c.hl;
}
// 卡片照片的 HTML：已經知道照片大小就直接畫好裁切（不用等載入）
function cropImg(url, box, useBox) {
  if (!useBox || !box) return `<img src="${esc(sm(url))}" loading="lazy" alt="">`;
  // 裁切放大時用大一點的圖，不然會糊
  const big = String(url || '').replace(/([?&]sz=)w\d+/, '$1w1600');
  const src = esc(big);
  const n = NAT[big], c = n && cropCalc(n[0], n[1], box);
  if (c) return `<img src="${src}" alt="" data-box="${esc(box)}" style="${c.img}"><i class="hl" style="${c.hl}"></i>`;
  return `<img src="${src}" loading="lazy" alt="" data-box="${esc(box)}" onload="fitCrop(this)">`;
}
// 備註：平常收起來（一張照片已經拆成單一商品，大多不用寫），要寫再點開
const MEMO_OPEN = {};
function memoBox(no, i, memo) {
  const k = no + '|' + i;
  if (!memo && !MEMO_OPEN[k]) return `<button class="memobtn" data-memoopen="${esc(k)}">＋ 備註</button>`;
  return `<input type="text" data-memo="${esc(no)}" data-i="${i}" placeholder="備註（例：要新包裝）" value="${esc(memo)}">`;
}
// 代理：子會員下拉選單（同一個商品已經選過的子會員會標「已選」不能重複選）；清單沒有的選最後一項自己輸入
function subPicker(no, i, l, lines) {
  const subs = (S.agency && S.agency.subs) || [];
  const inList = subs.some(x => x.code === l.sub);
  const typing = l.newSub || (l.sub && !inList);
  const used = lines.filter((x, k) => k !== i).map(x => x.sub);
  let o = `<option value="" ${!l.sub && !typing ? 'selected' : ''} disabled>選擇子會員</option>`;
  subs.forEach(x => {
    const u = used.indexOf(x.code) >= 0;
    o += `<option value="${esc(x.code)}" ${l.sub === x.code ? 'selected' : ''} ${u ? 'disabled' : ''}>${esc(x.code)}　${esc(x.name || '')}${u ? '（已選）' : ''}</option>`;
  });
  o += `<option value="__new" ${typing ? 'selected' : ''}>＋ 新子會員（打字）</option>`;
  return `<select class="subsel ${l.err && !typing ? 'err' : ''}" data-subsel="${esc(no)}" data-i="${i}">${o}</select>` +
    (typing ? `<input type="text" class="sub ${l.err ? 'err' : ''}" data-sub="${esc(no)}" data-i="${i}" placeholder="輸入子會員編號（例：${esc(S.agency.example || '')}）" value="${esc(l.sub)}" autocapitalize="characters">` : '');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showBusy(text) {
  document.getElementById('busyText').textContent = text || '處理中…';
  document.getElementById('busy').style.display = text === false ? 'none' : 'flex';
}

// 下單成功的大視窗：列出這次送出的商品
function showDone(title, sub, rows) {
  document.getElementById('doneTitle').textContent = title;
  document.getElementById('doneSub').textContent = sub || '';
  document.getElementById('doneList').innerHTML = rows.map(r =>
    `<div class="row"><img src="${esc(r.url || '')}" alt=""><div>${esc(r.no.slice(5))} 號${r.sub ? ` <span class="pill sb">${esc(r.sub)}</span>` : ''}${r.tag ? ` <span class="pill ok">${esc(r.tag)}</span>` : ''}${r.name ? `<div class="muted" style="color:#555">${esc(r.name)}</div>` : ''}${r.memo ? `<div class="muted">${esc(r.memo)}</div>` : ''}</div><b>×${r.q}</b></div>`).join('');
  document.getElementById('done').style.display = 'flex';
}
document.getElementById('doneOk').onclick = () => {
  document.getElementById('done').style.display = 'none';
  // 捲到「我的訂單」並閃一下，讓客人看到訂單在這裡
  const box = document.getElementById('mineBox');
  if (box) { box.scrollIntoView({ behavior: 'smooth', block: 'start' }); box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
};

async function call(req, quiet) {
  if (busy) return; busy = true;
  if (!quiet) showBusy(req.action === 'submit' ? '送出中…' : req.action === 'bind' ? '確認中…' : '處理中…');
  try {
    const r = await api(req);
    if (!r.ok) {
      toast(r.msg || '發生錯誤', false);
      if (r.relogin) setTimeout(() => { liff.logout(); liff.login({ redirectUri: location.href }); }, 1500);
    } else {
      S = r; render();
      if (r.msg && !quiet) toast(r.msg, true);
    }
    return r;
  } catch (e) {
    toast('連線失敗，請稍後再試', false);
  } finally { busy = false; showBusy(false); }
}

function render() {
  const app = document.getElementById('app');
  document.getElementById('who').textContent = S.member ? S.member + '　' + (S.name || '') : '';

  // 還沒綁定會員編號
  if (!S.member) {
    document.getElementById('bar').style.display = 'none';
    app.innerHTML = `<div class="box bind"><h3>第一次使用</h3>
      <div class="muted">請輸入你的會員編號，之後就會自動記住，不用再輸入。</div>
      <input type="text" id="code" placeholder="例如 NL012" autocapitalize="characters">
      <div style="height:10px"></div><button class="btn" id="bind">確認</button></div>`;
    document.getElementById('bind').onclick = () => {
      const v = document.getElementById('code').value.trim();
      if (!v) { toast('請輸入會員編號', false); return; }
      call({ action: 'bind', code: v });
    };
    return;
  }

  AG = !!S.agency;
  let h = '';
  if (AG) {
    if (!S.closed) h += `<div class="banner info">代理帳號：每一筆都要選<b>子會員</b>。同一個商品可以分給好幾位子會員（按「＋ 分給其他子會員」）。</div>`;
  }
  if (S.closed) h += `<div class="banner info">本場已截止收單，下面是你的訂單結果。</div>`;

  // 版面：手機是上下排，電腦是左（商品）右（我的訂單）
  h += `<div class="layout"><div>`;

  // 商品
  if (!S.closed) {
    if (!S.items.length) h += `<div class="center">採買人員還沒上傳商品，請稍等一下<br><span class="muted">頁面會自動更新</span></div>`;
    else {
      const ordered = {};
      S.mine.forEach(o => { if (!o.cancelled) ordered[o.no] = (ordered[o.no] || 0) + o.qty; });
      h += `<div class="grid">` + S.items.map(it => {
        const lines = cart[it.no] || [];
        const q = lines.reduce((a, l) => a + l.q, 0);
        const tag = it.sold ? `<span class="tag ng">已售完</span>` : (ordered[it.no] ? `<span class="tag ok">已訂 ${ordered[it.no]}</span>` : '');
        let ctl = '';
        if (it.sold) ctl = '<div class="muted" style="margin-top:6px">這個已經買不到了</div>';
        else if (!AG) {
          // 一般會員：一個數量＋備註
          const l = lines[0] || { q: 0, memo: '' };
          ctl = `<div class="step"><button data-no="${esc(it.no)}" data-i="0" data-d="-1" aria-label="減少">−</button><b>${l.q}</b><button data-no="${esc(it.no)}" data-i="0" data-d="1" aria-label="增加">＋</button></div>
            ${l.q ? memoBox(it.no, 0, l.memo) : ''}`;
        } else if (!lines.length) {
          // 代理：還沒選 → 一個「下單」按鈕
          ctl = `<button class="addsub" data-add="${esc(it.no)}">＋ 選子會員下單</button>`;
        } else {
          // 代理：每一行＝一位子會員
          ctl = lines.map((l, i) => `<div class="subl">
              ${subPicker(it.no, i, l, lines)}
              <div class="step"><button data-no="${esc(it.no)}" data-i="${i}" data-d="-1" aria-label="減少">−</button><b>${l.q}</b><button data-no="${esc(it.no)}" data-i="${i}" data-d="1" aria-label="增加">＋</button></div>
              ${memoBox(it.no, i, l.memo)}
            </div>`).join('') + `<button class="addsub" data-add="${esc(it.no)}">＋ 分給其他子會員</button>`;
        }
        return `<div class="card ${q ? 'sel' : ''}">
          <div class="ph" style="overflow:hidden">${cropImg(it.url, it.box, /-\d+$/.test(it.no))}${tag}<span class="no">${esc(it.no.slice(5))}</span></div>
          <div class="cb">
          ${it.pos && /-\d+$/.test(it.no) ? `<div class="pos">${posInfo(it.pos).grid}照片${posInfo(it.pos).text}的</div>` : ''}${it.name ? `<div class="pname">${esc(it.name)}</div>` : ''}${yen(it.price) ? `<div class="price"><b>${yen(it.price)}</b> <span class="muted">含稅</span></div>` : ''}${it.memo ? `<div class="memo">${esc(it.memo)}</div>` : ''}${ctl}
          </div></div>`;
      }).join('') + `</div>`;
    }
  }

  h += `</div><div class="side">`;

  // 我的訂單
  const priceOf = {};
  S.items.forEach(it => priceOf[it.no] = num(it.price));
  let total = 0, unknown = 0;
  S.mine.forEach(o => {
    if (o.cancelled || o.itemStatus === '欠品') return;
    const q = (o.got != null && o.got < o.qty) ? o.got : o.qty;
    if (priceOf[o.no]) total += priceOf[o.no] * q; else unknown++;
  });
  h += `<div class="box" id="mineBox" style="margin-top:14px"><h3>我的訂單</h3>`;
  if (total) h += `<div class="banner" style="background:#FFF4E5;color:#7A3E00;margin-bottom:8px">商品預估合計 <b style="font-size:17px">${yen(total)}</b>（含稅）${unknown ? `<div class="muted">另有 ${unknown} 筆價格未定</div>` : ''}<div class="muted">實際金額以收據為準，不含運費</div></div>`;
  if (!S.mine.length) h += `<div class="muted">還沒有訂單</div>`;
  S.mine.forEach(o => {
    const bought = o.itemStatus === '購入済' || o.itemStatus === '一部';
    let st = '';
    if (o.cancelled) st = `<span class="pill" style="background:#F1EFE8;color:#444">已取消</span>`;
    else if (o.itemStatus === '欠品') st = `<span class="pill ng">缺貨取消</span>`;
    else if (o.got != null && o.got < o.qty) st = `<span class="pill ng">只買到 ${o.got}</span>`;
    else if (bought) st = `<span class="pill ok">已買到</span>`;
    const lock = o.cancelled || o.itemStatus === '欠品' || S.closed;
    h += `<div class="line" style="${o.cancelled ? 'opacity:.5' : ''}"><img src="${esc(o.url || '')}" alt="">
      <div class="t"><div>${esc(o.no.slice(5))} 號 ${o.sub ? `<span class="pill sb">${esc(o.sub)}</span>` : ''} ${st}</div>
      ${o.name ? `<div class="muted" style="color:#555">${esc(o.name)}</div>` : ''}
      <div style="font-size:17px;font-weight:600">×${o.qty}${priceOf[o.no] && !o.cancelled ? ` <span style="font-size:13px;font-weight:400;color:#C2410C">${yen(priceOf[o.no] * o.qty)}</span>` : ''} ${o.parts.length > 1 ? `<span class="muted">(${o.parts.join('+')})</span>` : ''}</div>
      ${lock ? (o.memo ? `<div class="muted">${esc(o.memo)}</div>` : '') : `
      <div class="ops"><button data-op="-" data-id="${o.id}" aria-label="減少">−</button><button data-op="+" data-id="${o.id}" aria-label="增加">＋</button><button data-op="x" data-id="${o.id}">取消</button></div>
      <input type="text" data-om="${o.id}" placeholder="備註" value="${esc(o.memo)}">`}
      </div></div>`;
  });
  h += `</div>`;
  if (!S.closed) h += `<div class="muted" style="text-align:center">截止前都可以追加、改數量、改備註或取消<br>採買人員已經買到的商品只能追加</div>`;
  h += `</div></div>`;
  app.innerHTML = h;

  // 綁事件
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const no = b.dataset.no, i = Number(b.dataset.i);
    const lines = cart[no] = cart[no] || [];
    if (!lines[i]) lines[i] = { sub: '', q: 0, memo: '' };
    lines[i].q = Math.max(0, Math.min(99, lines[i].q + Number(b.dataset.d)));
    if (!lines[i].q) lines.splice(i, 1);           // 數量變 0 → 這一行拿掉
    if (!lines.length) delete cart[no];
    render();
  });
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const no = b.dataset.add;
    (cart[no] = cart[no] || []).push({ sub: '', q: 1, memo: '' });
    render();
    // 新增的那一行：直接打開子會員選單
    const sels = document.querySelectorAll(`[data-subsel="${CSS.escape(no)}"]`);
    const sel = sels[sels.length - 1];
    if (sel) { sel.focus(); try { sel.showPicker && sel.showPicker(); } catch (e) {} }
  });
  app.querySelectorAll('[data-memoopen]').forEach(b => b.onclick = () => {
    MEMO_OPEN[b.dataset.memoopen] = true; render();
    const [no, i] = b.dataset.memoopen.split('|');
    const inp = document.querySelector(`[data-memo="${CSS.escape(no)}"][data-i="${i}"]`); if (inp) inp.focus();
  });
  app.querySelectorAll('[data-memo]').forEach(i => i.oninput = () => { const l = (cart[i.dataset.memo] || [])[Number(i.dataset.i)]; if (l) l.memo = i.value; });
  app.querySelectorAll('[data-subsel]').forEach(sel => sel.onchange = () => {
    const no = sel.dataset.subsel, i = Number(sel.dataset.i);
    const l = (cart[no] || [])[i];
    if (!l) return;
    l.err = false;
    if (sel.value === '__new') { l.newSub = true; l.sub = ''; render(); const inp = document.querySelector(`[data-sub="${CSS.escape(no)}"][data-i="${i}"]`); if (inp) inp.focus(); return; }
    l.newSub = false; l.sub = sel.value; render();
  });
  app.querySelectorAll('[data-sub]').forEach(i => i.oninput = () => {
    const l = (cart[i.dataset.sub] || [])[Number(i.dataset.i)];
    if (l) { l.sub = i.value.trim().toUpperCase(); l.err = false; i.classList.remove('err'); }
  });
  app.querySelectorAll('[data-op]').forEach(b => b.onclick = () => {
    if (b.dataset.op === 'x' && !confirm('確定要取消這筆訂單嗎？')) return;
    call({ action: 'update', orderId: b.dataset.id, op: b.dataset.op });
  });
  app.querySelectorAll('[data-om]').forEach(i => i.onchange = () => call({ action: 'update', orderId: i.dataset.om, op: 'memo', memo: i.value }));

  const all = cartList();
  const n = all.reduce((a, x) => a + x.q, 0);
  const bar = document.getElementById('bar');
  bar.style.display = S.closed ? 'none' : 'flex';
  const btn = document.getElementById('submit');
  btn.textContent = n ? `送出訂單（${all.length} 筆，共 ${n} 個）` : '選好數量後送出';
  btn.disabled = !n;
}

// 購物車攤平成一筆一筆（代理：同一個商品、同一個子會員合併成一筆）
function cartList() {
  const out = [];
  Object.keys(cart).forEach(no => (cart[no] || []).forEach(l => {
    if (!l.q) return;
    const ex = out.find(x => x.no === no && x.sub === (l.sub || ''));
    if (ex) { ex.q += l.q; if (l.memo) ex.memo = l.memo; }
    else out.push({ no: no, sub: l.sub || '', q: l.q, memo: l.memo || '' });
  }));
  return out;
}

document.getElementById('submit').onclick = async () => {
  if (busy) return;
  const list = cartList();
  if (!list.length) { toast('請至少選一個商品的數量', false); return; }
  if (AG) {
    // 代理：每一行都要有子會員
    let miss = 0;
    Object.keys(cart).forEach(no => cart[no].forEach(l => { if (!l.sub) { l.err = true; miss++; } }));
    if (miss) { render(); toast('有 ' + miss + ' 筆還沒填子會員（紅框）', false); return; }
  }
  const before = {};
  (S.mine || []).forEach(o => { if (!o.cancelled) before[o.no + '|' + (o.sub || '')] = true; });
  const urls = {};
  const names = {};
  S.items.forEach(it => { urls[it.no] = it.url; names[it.no] = it.name; });
  // 按下去立刻有反應：按鈕變「送出中…」＋ 全畫面轉圈
  const btn = document.getElementById('submit');
  btn.classList.add('sending'); btn.textContent = '送出中…';
  if (navigator.vibrate) navigator.vibrate(30);
  showBusy('送出中…請稍候');
  const r = await call({ action: 'submit', cart: list }, true);
  btn.classList.remove('sending');
  showBusy(false);
  if (!r || !r.ok) render();
  if (r && r.ok) {
    cart = {}; render();
    const n = list.reduce((a, x) => a + x.q, 0);
    showDone('下單成功', `共 ${list.length} 筆、${n} 個，已經通知現場採買人員`,
      list.map(x => ({ no: x.no, name: names[x.no], sub: x.sub, q: x.q, memo: x.memo, url: urls[x.no], tag: before[x.no + '|' + x.sub] ? '追加' : '' })));
    if (r.msg && r.msg.indexOf('售完') >= 0) toast(r.msg, false);
  }
};

// 每 15 秒自動更新（看新上架的商品、售完狀態）
// 購物車裡選好的數量不會被清掉；只有正在打字時先不更新，免得打到一半畫面跳掉
setInterval(() => {
  if (!S || !S.member || S.closed || busy || document.hidden) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  call({ action: 'init' }, true);
}, 15000);
// 從別的 App 切回來時，馬上更新一次
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S && S.member && !S.closed && !busy) call({ action: 'init' }, true);
});

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (API_URL.indexOf('https://script.google.com/') !== 0) {
      document.getElementById('app').innerHTML = '<div class="center">網頁設定還沒完成（API_URL）</div>';
      return;
    }
    // 電腦或一般瀏覽器：先跳到 LINE 登入，登入完會自動回到這頁
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    call({ action: 'init' }, true);
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="center">無法開啟頁面，請從 LINE 裡打開連結。<br><span class="muted">' + esc(e.message || e) + '</span></div>';
  }
})();
</script>
<!-- 照片放大：點商品照片就全螢幕顯示，點照片可再放大 2 倍，點外面或 ✕ 關閉 -->
<style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#lb .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
#lb .lbw{position:relative;display:inline-block;line-height:0}
#lb img{max-width:100vw;max-height:100vh;display:block;cursor:zoom-in}
#lb.big img{max-width:none;max-height:none;width:200vw;cursor:zoom-out}
#lb .lbhl{position:absolute;border:4px solid #FF2D78;border-radius:12px;box-shadow:0 0 0 2px #fff;pointer-events:none;display:none}
#lb .x{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;font-weight:bold;color:#333;z-index:10000}
#lb .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#ddd;font-size:13px;pointer-events:none}
.zoomable{cursor:zoom-in}
</style>
<div id="lb"><button class="x" aria-label="關閉">✕</button><div class="wrap"><span class="lbw"><img alt=""><i class="lbhl"></i></span></div><div class="hint">點照片可放大，點旁邊關閉</div></div>
<script>
(function () {
  const lb = document.getElementById('lb'), im = lb.querySelector('img');
  const big = u => String(u || '').replace(/([?&]sz=)w\d+/, '$1w2000');
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.tagName === 'IMG' && !lb.contains(t) && t.closest('.ph, .line, .row, .card')) {
      e.preventDefault(); e.stopPropagation();
      im.src = t.src; im.src = big(t.src);
      // 有商品框就在大圖上也圈起來
      const hl = lb.querySelector('.lbhl'), bx = String(t.dataset.box || '').split(',').map(Number);
      if (bx.length === 4 && bx.every(v => v >= 0)) {
        Object.assign(hl.style, { display: 'block', top: bx[0] / 10 + '%', left: bx[1] / 10 + '%', height: (bx[2] - bx[0]) / 10 + '%', width: (bx[3] - bx[1]) / 10 + '%' });
      } else hl.style.display = 'none';
      lb.classList.remove('big'); lb.style.display = 'block'; document.body.style.overflow = 'hidden';
    }
  }, true);
  const close = () => { lb.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };
  lb.querySelector('.x').onclick = close;
  lb.addEventListener('click', e => {
    if (e.target === im) { lb.classList.toggle('big'); return; }
    if (e.target !== lb.querySelector('.x')) close();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>
