<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>現場確認</title>
<style>
  #ed { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
  #ed .sh { background: #fff; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 18px 18px 22px; box-sizing: border-box; }
  #ed h3 { margin: 0 0 12px; font-size: 18px; }
  #ed label.l { display: block; font-size: 13px; color: #666; margin: 12px 0 6px; }
  #ed .row { display: flex; gap: 8px; align-items: center; }
  #ed #edM { width: 100%; }
  #ed input[type=number], #ed input[type=text] { flex: 1; height: 46px; font-size: 18px; border: 1.5px solid #ccc; border-radius: 10px; padding: 0 12px; box-sizing: border-box; min-width: 0; }
  #ed .seg { display: flex; border: 1.5px solid #06C755; border-radius: 10px; overflow: hidden; flex: none; }
  #ed .seg button { border: 0; background: #fff; color: #0F6E56; font-size: 15px; font-weight: 700; padding: 0 14px; height: 43px; }
  #ed .seg button.on { background: #06C755; color: #fff; }
  #ed .chk { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1.5px solid #ddd; border-radius: 12px; font-size: 17px; font-weight: 700; margin-top: 8px; }
  #ed .chk input[type=checkbox] { width: 24px; height: 24px; accent-color: #E02424; flex: none; }
  #ed .chk.on.sale { border-color: #E02424; background: #FFF1F1; color: #B91C1C; }
  #ed .chk.on.lim { border-color: #F59E0B; background: #FFF7E6; color: #9A4A00; }
  #ed .chk input[type=number] { flex: 0 0 90px; height: 40px; font-size: 18px; text-align: center; }
  #ed .btns { display: flex; gap: 10px; margin-top: 18px; }
  #ed .btns button { flex: 1; height: 52px; border-radius: 12px; font-size: 17px; font-weight: 800; border: 0; }
  #ed .btns .c { background: #F1EFE8; color: #444; }
  #ed .btns .s { background: #06C755; color: #fff; box-shadow: 0 4px 0 #04913E; }

  .edit { border: 1px solid #9FD9C4; background: #F2FBF7; color: #0F6E56; border-radius: 6px; font-size: 12px; padding: 3px 8px; }
  .mts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .mt { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: .5px; }
  .mt.sale { background: #E02424; color: #fff; }
  .mt.limit { background: #FFF1D6; color: #9A4A00; border: 1.5px solid #F59E0B; }
  .card.hot { border-color: #F3A5A5; }

  .hl { position: absolute; border: 3px solid #FF2D78; border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 9999px rgba(0,0,0,.18); pointer-events: none; box-sizing: border-box; }
  .cw { position: relative; overflow: hidden; width: 76px; height: 76px; border-radius: 8px; flex-shrink: 0; background: #e9e8e2; }
  .cw img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .pg { display: inline-grid; grid-template-columns: repeat(3, 5px); gap: 1.5px; vertical-align: middle; margin-right: 5px; flex: none; padding: 2px; background: #fff; border-radius: 3px; border: 1px solid #9FD9C4; }
  .pg i { width: 5px; height: 5px; background: #D5EFE5; border-radius: 1px; }
  .pg i.on { background: #E0457B; }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 15px; }
  header { background: #06C755; color: #fff; padding: 12px 14px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header .st { margin-left: auto; background: #fff; color: #06C755; font-size: 13px; padding: 2px 10px; border-radius: 8px; }
  header .st.closed { color: #A32D2D; }
  main { padding: 12px; padding-bottom: 80px; }
  .prog { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: #555; }
  .prog .b { flex: 1; height: 8px; background: #e2e0d8; border-radius: 4px; overflow: hidden; }
  .prog .b div { height: 100%; background: #06C755; }
  .log { background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; }
  .log b { font-size: 13px; }
  .card { background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; border: 1px solid #e5e3db; }
  .card.flag { border: 2px solid #EF9F27; }
  .card img { width: 76px; height: 76px; border-radius: 8px; object-fit: cover; background: #e9e8e2; flex-shrink: 0; }
  .t { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .need { font-size: 13px; } .need b { font-size: 22px; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; }
  .TODO { background: #F1EFE8; color: #444441; } .DONE { background: #EAF3DE; color: #27500A; }
  .PART { background: #FAEEDA; color: #633806; } .NG { background: #FCEBEB; color: #791F1F; }
  .chg { background: #FAEEDA; color: #633806; }
  .del { height: 24px; padding: 0 8px; border: 1px solid #F09595; border-radius: 6px; background: #fff; color: #A32D2D; font-size: 12px; }
  .lines { font-size: 14px; margin: 6px 0; }
  .lines .short { color: #A32D2D; }
  .sub { color: #888; font-size: 12px; }
  .ops { display: flex; gap: 5px; }
  .ops button { height: 40px; padding: 0 6px; border: 1px solid #bbb; border-radius: 9px; background: #fff; font-size: 13px; flex: 1; white-space: nowrap;
                 box-shadow: 0 3px 0 #d3d1c7; transition: transform .06s, box-shadow .06s; -webkit-tap-highlight-color: transparent; }
  .ops button:active, .ops button.pressed { transform: translateY(2px); box-shadow: 0 1px 0 #d3d1c7; background: #F1EFE8; }
  .ops button.main { box-shadow: 0 3px 0 #04913E; }
  .ops button.main:active, .ops button.main.pressed { box-shadow: 0 1px 0 #04913E; background: #05A045; }
  .card.done-flash { animation: df 1.2s ease-out; }
  @keyframes df { 0% { background: #EAF3DE; } 100% { background: #fff; } }
  #busy { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 20; display: none; align-items: center; justify-content: center; }
  #busy .bx { background: #fff; border-radius: 16px; padding: 22px 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .spin { width: 40px; height: 40px; border: 5px solid #d8f3e3; border-top-color: #06C755; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .ops button.main { flex: 1.6; }
  .ops button.main { background: #06C755; border-color: #06C755; color: #fff; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 10px 12px; box-shadow: 0 -1px 0 #e5e3db; }
  .bar button { width: 100%; height: 46px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 600; background: #A32D2D; color: #fff; }
  .stores { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; font-size: 13px; }
  .stores button { height: 34px; padding: 0 10px; border: 1px solid #bbb; border-radius: 17px; background: #fff; font-size: 13px; }
  .stores button.on { background: #06C755; border-color: #06C755; color: #fff; }
  .stores.need { background: #FFF4E5; border-radius: 10px; padding: 6px 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; height: 40px; border: 1px solid #bbb; border-radius: 10px; background: #fff; font-size: 15px; }
  .tabs button.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
  .cust { background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 10px; border: 1px solid #e5e3db; }
  .cust .ch { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid #eee; margin-bottom: 6px; }
  .cust .ch b { font-size: 17px; } .cust .ch .sum { margin-left: auto; font-size: 13px; color: #555; }
  .ci { display: flex; gap: 8px; align-items: center; padding: 5px 0; }
  .ci img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #e9e8e2; flex-shrink: 0; }
  .ci .q { font-size: 18px; font-weight: 600; min-width: 44px; }
  .ci .x { flex: 1; min-width: 0; font-size: 13px; }
  .ci.ng { opacity: .55; }
  .tag.sb { background: #E1F5EE; color: #085041; }
  .subg { border-left: 3px solid #9FE1CB; padding-left: 8px; margin: 6px 0 4px; }
  .subg > b { color: #085041; font-size: 14px; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 76px; padding: 14px 14px; font-size: 16px; font-weight: 700; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.15); border-radius: 10px; display: none; z-index: 9; white-space: pre-line; }
  .center { text-align: center; padding: 40px 16px; color: #666; }
</style>
</head>
<body>
<header><span>現場確認</span><span class="st" id="st"></span></header>
<main id="app"><div class="center">読み込み中…</div></main>
<div class="bar"><button id="close">締切（受付終了）</button></div>
<div id="ed"><div class="sh" role="dialog" aria-labelledby="edT">
  <h3 id="edT">価格・備考</h3>
  <label class="l" for="edP">価格（空欄なら変更しない）</label>
  <div class="row"><input id="edP" type="number" inputmode="numeric" placeholder="例：980"><div class="seg"><button type="button" data-tax="in" class="on">税込</button><button type="button" data-tax="ex">税抜</button></div></div>
  <label class="chk sale" id="edSaleL"><input id="edSale" type="checkbox">特価（とっか）</label>
  <label class="chk lim" id="edLimL"><input id="edLim" type="checkbox"><span>数量限定</span><input id="edLimN" type="number" inputmode="numeric" placeholder="個数" min="1" aria-label="限定の個数"><span>個</span></label>
  <label class="l" for="edM">その他メモ（任意）</label>
  <input id="edM" type="text" placeholder="例：新パッケージ">
  <div class="btns"><button class="c" type="button" id="edX">キャンセル</button><button class="s" type="button" id="edOk">保存</button></div>
</div></div>
<div id="toast"></div>
<div id="busy"><div class="bx"><div class="spin"></div><div id="busyText">処理中…</div></div></div>

<script>
// GAS 部署網址（跟下單頁 index.html 用同一個）
const API_URL = 'https://script.google.com/macros/s/AKfycbwjQK4vcmgDAeD-uJ424b-IM3ciq6mvAp1uILcIy27sGWsiBsx8_i7Rz6pAY9oO6DYeKg/exec';
const CLS = { '未処理': 'TODO', '購入済': 'DONE', '一部': 'PART', '欠品': 'NG' };
let S = null, busy = false;
let VIEW = 'item';   // 'item' = 商品別、'cust' = お客様別

function api(req) {
  // 不加 Content-Type，瀏覽器就不會先送 CORS 預檢，GAS 才收得到
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(req) }).then(r => r.json());
}
// 一覧は小さい画像（100 枚でも軽い）；拡大時は大きい画像
function sm(u) { return String(u || '').replace(/([?&]sz=)w\d+/, '$1w400'); }
// 位置：「上段左」這種貨架用語客人看不懂 → 改成「左上」（日本語表示）＋ 3×3 小格子標出在照片哪裡
function posInfo(p) {
  p = String(p || '');
  const r = /上/.test(p) ? 0 : /下/.test(p) ? 2 : 1;
  const c = /左/.test(p) ? 0 : /右/.test(p) ? 2 : 1;
  const V = ['上', '', '下'], H = ['左', '', '右'];
  let t = (H[c] + V[r]) || '中央';
  if (!H[c] && V[r]) t = V[r] + '中央';
  if (H[c] && !V[r]) t = H[c] + '側';
  let g = '';
  for (let i = 0; i < 9; i++) g += `<i class="${i === r * 3 + c ? 'on' : ''}"></i>`;
  return { text: t, grid: `<span class="pg">${g}</span>` };
}
// 一張照片拆成好幾個商品時：卡片只放大顯示那個商品，並用粉紅框圈起來（AI 給的框）
// 算好的大小記在 NAT，下次重畫（按＋−）直接套用，照片不會閃一下、抖一下
const NAT = {};
// 一張照片拆出來的商品（編號像 1119-33-1）才圈框；1119-33 這種單一商品不用
function isSplit(no) { return /^\d{4}-\d+-\d+$/.test(String(no || '')); }
// 框太細、太小（AI 框錯）就不用，顯示整張照片
function boxOk(b) {
  const w = b[3] - b[1], h = b[2] - b[0];
  return w > 0 && h > 0 && w * h >= 15000 && w / h <= 5 && h / w <= 5;
}
function cropCalc(nw, nh, boxStr) {
  const b = String(boxStr || '').split(',').map(Number);
  if (b.length !== 4 || !nw || !boxOk(b)) return null;
  const x0 = b[1] / 1000 * nw, y0 = b[0] / 1000 * nh, x1 = b[3] / 1000 * nw, y1 = b[2] / 1000 * nh;
  const bw = x1 - x0, bh = y1 - y0;
  let side = Math.max(Math.max(bw, bh) * 1.3, Math.min(nw, nh) * 0.35);
  // 不要超出照片（兩旁出現灰邊）；除非商品本身比照片的短邊還大
  if (side > Math.min(nw, nh)) side = Math.max(Math.min(nw, nh), Math.max(bw, bh));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const sx = side <= nw ? Math.min(Math.max(0, cx - side / 2), nw - side) : (nw - side) / 2;
  const sy = side <= nh ? Math.min(Math.max(0, cy - side / 2), nh - side) : (nh - side) / 2;
  const P = v => (v / side * 100).toFixed(3) + '%';
  return {
    img: `position:absolute;max-width:none;object-fit:fill;border-radius:0;width:${P(nw)};height:${P(nh)};left:${P(-sx)};top:${P(-sy)}`,
    hl: `left:${P(x0 - sx)};top:${P(y0 - sy)};width:${P(bw)};height:${P(bh)}`
  };
}
function fitCrop(img) {
  if (!img.naturalWidth) return;
  NAT[img.getAttribute('src')] = [img.naturalWidth, img.naturalHeight];
  const c = cropCalc(img.naturalWidth, img.naturalHeight, img.dataset.box);
  if (!c) return;
  img.style.cssText = c.img;
  let hl = img.parentNode.querySelector('.hl');
  if (!hl) { hl = document.createElement('i'); hl.className = 'hl'; img.parentNode.appendChild(hl); }
  hl.style.cssText = c.hl;
}
// 卡片照片的 HTML：已經知道照片大小就直接畫好裁切（不用等載入）
function cropImg(url, box, useBox) {
  if (!useBox || !box) return `<img src="${esc(sm(url))}" loading="lazy" alt="">`;
  // 裁切放大時用大一點的圖，不然會糊
  const big = String(url || '').replace(/([?&]sz=)w\d+/, '$1w1600');
  const src = esc(big);
  const n = NAT[big], c = n && cropCalc(n[0], n[1], box);
  if (c) return `<img src="${src}" alt="" data-box="${esc(box)}" style="${c.img}"><i class="hl" style="${c.hl}"></i>`;
  return `<img src="${src}" loading="lazy" alt="" data-box="${esc(box)}" onload="fitCrop(this)">`;
}
// 採買人員的備註：「特價」「限量」變成醒目的標籤，其他文字照常顯示
function memoTags(memo) {
  let m = String(memo || '').trim();
  if (!m) return '';
  let tags = '';
  if (/特價|特価|特賣|セール|SALE|折扣|優惠|お買い得|値下/i.test(m)) {
    tags += `<span class="mt sale">特価</span>`;
    m = m.replace(/特價|特価|特賣|セール|SALE|折扣|優惠|お買い得|値下げ?/gi, ' ');
  }
  const lim = m.match(/(限量|限定|数量限定|數量限定|残り|剩)\s*(\d+\s*(個|件|點|点|組|袋|箱)?)?/);
  if (lim) {
    tags += `<span class="mt limit">数量限定${lim[2] ? ' ' + esc(lim[2].replace(/\s/g, '')) : ''}</span>`;
    m = m.replace(lim[0], ' ');
  }
  m = m.replace(/\s+/g, ' ').trim();
  return (tags ? `<div class="mts">${tags}</div>` : '') + (m ? `<div class="memo">${esc(m)}</div>` : '');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(t, good) {
  const e = document.getElementById('toast');
  e.textContent = t; e.style.background = good ? '#EAF3DE' : '#FCEBEB'; e.style.color = good ? '#27500A' : '#791F1F'; e.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', 3000);
}
function showBusy(t) {
  document.getElementById('busyText').textContent = t || '処理中…';
  document.getElementById('busy').style.display = t === false ? 'none' : 'flex';
}
// ボタンごとの完了メッセージ
const DONE_MSG = { ok: '全数購入にしました', ng: '欠品にしました', pm: '購入数を1つ減らしました', pp: '購入数を1つ増やしました', del: '削除しました' };

async function call(req, quiet) {
  if (busy) return; busy = true;
  if (!quiet) showBusy(req.action === 'staff_close' ? '締切中…' : '処理中…');
  try {
    const r = await api(req);
    if (r.needForce) {
      busy = false;
      if (confirm(r.msg)) return call({ action: 'staff_close', force: true });
      return;
    }
    if (!r.ok) { toast(r.msg || 'エラー', false); return; }
    if (quiet && qRunning) return;   // 裏で保存中は上書きしない
    S = r; render();
    if (req.action === 'staff_set' && !quiet) {
      // 完了：メッセージ＋そのカードを緑に光らせる
      toast('✓ ' + req.no.slice(5) + '　' + (DONE_MSG[req.act] || '更新しました'), true);
      const c = document.querySelector(`[data-card="${CSS.escape(req.no)}"]`);
      if (c) { c.classList.add('done-flash'); }
    } else if (r.msg && !quiet) toast('✓ ' + r.msg, true);
  } catch (e) { toast('通信エラー。もう一度お試しください', false); }
  finally { busy = false; showBusy(false); }
}

function render() {
  const st = document.getElementById('st');
  st.textContent = S.closed ? '締切済' : '受付中';
  st.className = 'st' + (S.closed ? ' closed' : '');
  const closeBtn = document.getElementById('close');
  closeBtn.textContent = S.closed ? '受付を再開する' : '締切（受付終了）';
  closeBtn.style.background = S.closed ? '#888780' : '#A32D2D';

  // 注文が0件の商品は「変更あり」を出さない（全部取消された商品がずっと上に残らないように）
  S.items.forEach(i => { i.flag = !!i.flag && i.need > 0; });
  const items = S.items.slice().sort((a, b) =>
    (b.flag - a.flag) || ((a.need > 0) - (b.need > 0)) * -1 || ((a.status !== '未処理') - (b.status !== '未処理')) || (b.need - a.need));
  // 進度：只算「有人訂」的商品，處理完幾個 / 共幾個
  const ordered = S.items.filter(i => i.need > 0);
  const done = ordered.filter(i => i.status !== '未処理').length;

  let h = `<div class="prog"><span>処理済</span><div class="b"><div style="width:${ordered.length ? Math.round(done / ordered.length * 100) : 0}%"></div></div>${done} / ${ordered.length}</div>`;
  if (S.analyzing) h += `<div class="sub" style="margin-bottom:8px">🔍 写真を解析中：${S.analyzing} 枚（数秒で表示されます）</div>`;
  h += `<div class="stores ${S.store ? '' : 'need'}"><span>${S.store ? '本日の店舗' : '⚠️ 本日の店舗を選んでください'}</span>${(S.stores || []).map(st => `<button data-store="${esc(st)}" class="${S.store === st ? 'on' : ''}">${esc(st)}</button>`).join('')}</div>`;
  h += `<div class="tabs"><button data-view="item" class="${VIEW === 'item' ? 'on' : ''}">商品別</button><button data-view="cust" class="${VIEW === 'cust' ? 'on' : ''}">お客様別</button></div>`;
  if (VIEW === 'cust') {
    h += custView();
    const app = document.getElementById('app');
    app.innerHTML = h;
    app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { VIEW = b.dataset.view; render(); });
    bindStores(app);
    return;
  }
  h += `<div class="log"><b>変更履歴</b>` + (S.logs.length ? S.logs.map(l =>
    `<div>${esc(l.time)}　${esc(l.type)}｜${esc(l.code)} ${esc(l.name)}｜${esc(l.no)} ${esc(l.text)}</div>`).join('') : '<div class="sub">まだありません</div>') + `</div>`;

  if (!items.length) h += `<div class="center">写真を送ると、ここに商品が出ます</div>`;
  items.forEach(i => {
    const lines = i.lines.length ? i.lines.map(l => {
      const short = (i.status === '一部' || i.status === '欠品') && l.got != null && l.got < l.qty;
      return `<div class="${short ? 'short' : ''}">${esc(l.code)} ${esc(l.name)}${l.sub ? ` <span class="tag sb">${esc(l.sub)}</span>` : ''}　×${l.qty}${l.parts.length > 1 ? ` <span class="sub">(${l.parts.join('+')})</span>` : ''}${short ? ' → ' + l.got : ''}${l.memo ? ` <span class="sub">${esc(l.memo)}</span>` : ''}</div>`;
    }).join('') : '<div class="sub">注文なし</div>';
    h += `<div class="card ${i.flag ? 'flag' : ''}" data-card="${esc(i.no)}"><span class="cw">${cropImg(i.url, i.box, isSplit(i.no))}</span>
      <div class="t"><div class="top"><b>${esc(i.no.slice(5))}</b>
        <span class="need">必要 <b>${i.need}</b> 個${i.status === '一部' ? '　購入 ' + i.got : ''}${i.status === '未処理' && i.got ? '　<span class="sub">(購入済 ' + i.got + ')</span>' : ''}</span>
        <span style="margin-left:auto;display:flex;gap:4px;align-items:center">${i.flag ? '<span class="tag chg">変更あり</span>' : ''}<span class="tag ${CLS[i.status] || 'TODO'}">${esc(i.status)}</span>${!S.closed && !i.need ? `<button class="del" data-del="${esc(i.no)}" aria-label="削除">削除</button>` : ''}</span></div>
        ${i.pos && isSplit(i.no) ? `<span class="tag sb">${posInfo(i.pos).grid}写真の${posInfo(i.pos).text}</span>` : ''}
        ${i.name || i.nameJa ? `<div style="font-size:13px;line-height:1.35">${esc(i.nameJa || i.name)}${i.nameJa && i.name ? `<div class="sub">${esc(i.name)}</div>` : ''}</div>` : ''}
        <div class="sub" style="display:flex;align-items:center;gap:6px">${i.price ? `税込 ${esc(i.price)}円` : '<span style="color:#C2410C;font-weight:700">価格なし</span>'}${S.closed ? '' : `<button class="edit" data-edit="${esc(i.no)}">価格・備考を編集</button>`}</div>${memoTags(i.memo).replace('>特價<', '>特価<')}
        <div class="lines">${lines}</div>
        ${S.closed || !i.need ? '' : `<div class="ops">
          <button class="main" data-no="${esc(i.no)}" data-act="ok">全数購入</button>
          <button data-no="${esc(i.no)}" data-act="pm" aria-label="一つ減らす">一部 −</button>
          <button data-no="${esc(i.no)}" data-act="pp" aria-label="一つ増やす">＋</button>
          <button data-no="${esc(i.no)}" data-act="ng">欠品</button></div>`}
      </div></div>`;
  });
  const app = document.getElementById('app');
  app.innerHTML = h;
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { VIEW = b.dataset.view; render(); });
  bindStores(app);
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (confirm(b.dataset.del.slice(5) + ' 番の商品を削除しますか？\nお客様の注文ページからも消えます。')) call({ action: 'staff_set', no: b.dataset.del, act: 'del' });
  });
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    if (navigator.vibrate) navigator.vibrate(30);
    quickSet(b.dataset.no, b.dataset.act);
  });
}

/* 全数購入・一部・欠品：押した瞬間に画面を更新し、保存は裏で順番に送る（待たない）
 * 保存に失敗したら赤いメッセージを出して最新の状態に戻す */
const Q = [];
let qRunning = false;
function quickSet(no, act) {
  const i = S && S.items.find(x => x.no === no);
  if (!i || S.closed) return;
  const need = i.need;
  let st, got;
  if (act === 'ok') { st = '購入済'; got = need; }
  else if (act === 'ng') { st = '欠品'; got = 0; }
  else {
    let g = (i.status !== '未処理' || i.got > 0) ? i.got : need;
    if (i.status === '欠品') g = 0;
    g += act === 'pp' ? 1 : -1;
    g = Math.max(0, Math.min(need, g));
    if (g >= need && need > 0) { st = '購入済'; got = need; }
    else if (g <= 0) { st = '欠品'; got = 0; }
    else { st = '一部'; got = g; }
  }
  i.status = st; i.got = got; i.flag = false;
  if (st === '購入済') i.lines.forEach(l => l.got = l.qty);
  if (st === '欠品') i.lines.forEach(l => l.got = 0);
  render();
  const c = document.querySelector(`[data-card="${CSS.escape(no)}"]`);
  if (c) c.classList.add('done-flash');
  toast('✓ ' + no.slice(5) + '　' + (st === '一部' ? '一部購入（' + got + ' 個）にしました' : (DONE_MSG[act] || '更新しました')), true);
  Q.push({ action: 'staff_set', no: no, act: act });
  runQ();
}
async function runQ() {
  if (qRunning) return; qRunning = true;
  setSaving(true);
  while (Q.length) {
    const req = Q.shift();
    try {
      const r = await api(req);
      if (!r.ok) { toast('⚠️ ' + req.no.slice(5) + ' 保存できませんでした：' + (r.msg || 'エラー'), false); Q.length = 0; }
      if (!Q.length && r.items) { S = r; render(); }
    } catch (e) {
      toast('⚠️ ' + req.no.slice(5) + ' 通信エラー。もう一度押してください', false); Q.length = 0;
      call({ action: 'staff_get' }, true);
    }
  }
  qRunning = false; setSaving(false);
}
function setSaving(on) {
  let e = document.getElementById('saving');
  if (!e) { e = document.createElement('div'); e.id = 'saving'; e.style.cssText = 'position:fixed;top:8px;right:8px;background:#FFF4E0;color:#8A5300;font-size:12px;padding:4px 10px;border-radius:12px;z-index:50;display:none'; e.textContent = '保存中…'; document.body.appendChild(e); }
  e.style.display = on ? 'block' : 'none';
}

// 店舗ボタン：押すとその店の税ルールで価格を計算し直す
function bindStores(app) {
  app.querySelectorAll('[data-store]').forEach(b => b.onclick = () => {
    if (S.store === b.dataset.store) return;
    call({ action: 'staff_store', store: b.dataset.store });
  });
}

// お客様別：会員番号ごとに「何を何個」まとめて表示
function custView() {
  const by = {};
  S.items.forEach(i => i.lines.forEach(l => {
    const k = l.code || '?';
    (by[k] = by[k] || { code: k, name: l.name, rows: [] }).rows.push({ item: i, l: l });
  }));
  const list = Object.values(by).sort((a, b) => a.code.localeCompare(b.code));
  if (!list.length) return `<div class="center">まだ注文がありません</div>`;
  return `<div class="sub" style="margin-bottom:8px">${list.length} 名</div>` + list.map(c => {
    const pcs = c.rows.reduce((a, r) => a + r.l.qty, 0);
    const rowHtml = r => {
      const i = r.item, l = r.l;
      let st = '';
      if (i.status === '欠品') st = '<span class="tag NG">欠品</span>';
      else if (i.status === '一部' && l.got != null && l.got < l.qty) st = `<span class="tag PART">→ ${l.got}</span>`;
      else if (i.status === '購入済' || i.status === '一部') st = '<span class="tag DONE">購入済</span>';
      return `<div class="ci ${i.status === '欠品' ? 'ng' : ''}"><img src="${esc(i.url)}" loading="lazy" alt="">
        <div class="q">×${l.qty}</div>
        <div class="x"><b>${esc(i.no.slice(5))}</b> ${st}${i.nameJa || i.name ? `<div style="font-size:12px">${esc(i.nameJa || i.name)}</div>` : ''}${l.memo ? `<div class="sub">${esc(l.memo)}</div>` : ''}</div></div>`;
    };
    c.rows.sort((a, b) => (a.l.sub || '').localeCompare(b.l.sub || '') || a.item.no.localeCompare(b.item.no));
    let rows = '';
    if (c.rows.some(r => r.l.sub)) {
      // 代理：再依子會員分組
      const subs = [...new Set(c.rows.map(r => r.l.sub || '—'))];
      rows = subs.map(sb => {
        const rs = c.rows.filter(r => (r.l.sub || '—') === sb);
        return `<div class="subg"><b>${esc(sb)}</b> <span class="sub">${rs.reduce((a, r) => a + r.l.qty, 0)} 個</span>${rs.map(rowHtml).join('')}</div>`;
      }).join('');
    } else rows = c.rows.map(rowHtml).join('');
    return `<div class="cust"><div class="ch"><b>${esc(c.code)}</b><span>${esc(c.name)}</span><span class="sum">${c.rows.length} 品・${pcs} 個</span></div>${rows}</div>`;
  }).join('');
}

document.getElementById('close').onclick = () => {
  if (S && S.closed) {
    if (confirm('受付を再開しますか？')) call({ action: 'staff_reopen' });
    return;
  }
  if (confirm('締切しますか？お客様のグループに結果が通知されます。')) call({ action: 'staff_close' });
};

setInterval(() => { if (!busy && !qRunning && !document.hidden) call({ action: 'staff_get' }, true); }, 10000);
// 從 LINE 或相機切回來時，馬上更新一次
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy && !qRunning) call({ action: 'staff_get' }, true); });
call({ action: 'staff_get' }, true);
</script>
<!-- 照片放大：點商品照片就全螢幕顯示，點照片可再放大 2 倍，點外面或 ✕ 關閉 -->
<style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#lb .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
#lb .lbw{position:relative;display:inline-block;line-height:0}
#lb img{max-width:100vw;max-height:100vh;display:block;cursor:zoom-in}
#lb.big img{max-width:none;max-height:none;width:200vw;cursor:zoom-out}
#lb .lbhl{position:absolute;border:4px solid #FF2D78;border-radius:12px;box-shadow:0 0 0 2px #fff;pointer-events:none;display:none}
#lb .x{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;font-weight:bold;color:#333;z-index:10000}
#lb .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#ddd;font-size:13px;pointer-events:none}
.zoomable{cursor:zoom-in}
</style>
<div id="lb"><button class="x" aria-label="閉じる">✕</button><div class="wrap"><span class="lbw"><img alt=""><i class="lbhl"></i></span></div><div class="hint">写真をタップで拡大・外側をタップで閉じる</div></div>
<script>
(function () {
  const lb = document.getElementById('lb'), im = lb.querySelector('img');
  const big = u => String(u || '').replace(/([?&]sz=)w\d+/, '$1w2000');
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.tagName === 'IMG' && !lb.contains(t) && t.closest('.card')) {
      e.preventDefault(); e.stopPropagation();
      im.src = t.src; im.src = big(t.src);
      // 有商品框就在大圖上也圈起來
      const hl = lb.querySelector('.lbhl'), bx = String(t.dataset.box || '').split(',').map(Number);
      if (bx.length === 4 && bx.every(v => v >= 0) && boxOk(bx)) {
        Object.assign(hl.style, { display: 'block', top: bx[0] / 10 + '%', left: bx[1] / 10 + '%', height: (bx[2] - bx[0]) / 10 + '%', width: (bx[3] - bx[1]) / 10 + '%' });
      } else hl.style.display = 'none';
      lb.classList.remove('big'); lb.style.display = 'block'; document.body.style.overflow = 'hidden';
    }
  }, true);
  const close = () => { lb.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };
  lb.querySelector('.x').onclick = close;
  lb.addEventListener('click', e => {
    if (e.target === im) { lb.classList.toggle('big'); return; }
    if (e.target !== lb.querySelector('.x')) close();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();

// 価格・備考の編集：特価・数量限定はチェックで選ぶだけ（入力は数字だけ）
let ED_NO = null, ED_TAX = 'in';
const SALE_RE = /特價|特価|特賣|セール|SALE|折扣|優惠|お買い得|値下げ?/gi;
const LIM_RE = /(限量|限定|数量限定|數量限定|残り|剩)\s*(\d+)?\s*(個|件|點|点|組|袋|箱)?/;
function openEdit(no) {
  const i = S.items.find(x => x.no === no); if (!i) return;
  ED_NO = no;
  let m = String(i.memo || '');
  const sale = SALE_RE.test(m); SALE_RE.lastIndex = 0;
  m = m.replace(SALE_RE, ' ');
  const lim = m.match(LIM_RE);
  if (lim) m = m.replace(lim[0], ' ');
  document.getElementById('edT').textContent = no.slice(5) + ' 番　価格・備考';
  document.getElementById('edP').value = '';
  document.getElementById('edP').placeholder = i.price ? '今：税込 ' + i.price + '円' : '例：980';
  setTax('in');
  document.getElementById('edSale').checked = sale;
  document.getElementById('edLim').checked = !!lim;
  document.getElementById('edLimN').value = lim && lim[2] ? lim[2] : '';
  document.getElementById('edM').value = m.replace(/\s+/g, ' ').trim();
  syncChk();
  document.getElementById('ed').style.display = 'flex';
}
function setTax(t) { ED_TAX = t; document.querySelectorAll('#ed [data-tax]').forEach(b => b.classList.toggle('on', b.dataset.tax === t)); }
function syncChk() {
  document.getElementById('edSaleL').classList.toggle('on', document.getElementById('edSale').checked);
  document.getElementById('edLimL').classList.toggle('on', document.getElementById('edLim').checked);
}
document.querySelectorAll('#ed [data-tax]').forEach(b => b.onclick = () => setTax(b.dataset.tax));
document.getElementById('edSale').onchange = syncChk;
document.getElementById('edLim').onchange = () => { syncChk(); if (document.getElementById('edLim').checked) document.getElementById('edLimN').focus(); };
document.getElementById('edLimN').oninput = () => { if (document.getElementById('edLimN').value) { document.getElementById('edLim').checked = true; syncChk(); } };
document.getElementById('edX').onclick = () => { document.getElementById('ed').style.display = 'none'; };
document.getElementById('ed').onclick = e => { if (e.target.id === 'ed') document.getElementById('ed').style.display = 'none'; };
document.getElementById('edOk').onclick = () => {
  const p = document.getElementById('edP').value.trim();
  const limOn = document.getElementById('edLim').checked, n = document.getElementById('edLimN').value.trim();
  if (limOn && !(Number(n) >= 1)) { toast('数量限定の個数を入れてください', false); document.getElementById('edLimN').focus(); return; }
  const memo = [document.getElementById('edSale').checked ? '特価' : '', limOn ? '限量' + Number(n) : '', document.getElementById('edM').value.trim()].filter(Boolean).join(' ');
  const text = (p ? p + (ED_TAX === 'ex' ? '税抜' : '') + ' ' : '') + (memo || '-');
  document.getElementById('ed').style.display = 'none';
  call({ action: 'staff_edit', no: ED_NO, text: text });
};
</script>
